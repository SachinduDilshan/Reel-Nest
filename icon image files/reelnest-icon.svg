<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232d"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="reel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff3b45"/>
      <stop offset="1" stop-color="#b00710"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- soft outer ring -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="8"/>

  <!-- reel body -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="330" fill="url(#reel)"/>
  </g>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>

  <!-- reel holes -->
  <g fill="#0b0b0f">
    <circle cx="512" cy="297" r="70"/>
    <circle cx="698.2" cy="404.5" r="70"/>
    <circle cx="698.2" cy="619.5" r="70"/>
    <circle cx="512" cy="727" r="70"/>
    <circle cx="325.8" cy="619.5" r="70"/>
    <circle cx="325.8" cy="404.5" r="70"/>
  </g>

  <!-- hub + play -->
  <circle cx="512" cy="512" r="122" fill="#0b0b0f"/>
  <circle cx="512" cy="512" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>
  <path d="M474 446 L474 578 L582 512 Z" fill="#ffffff" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
